[build-system]
requires = ["setuptools>=65.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "uc-intg-cambridge-audio"
description = "Cambridge Audio integration for Unfolded Circle Remote"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MPL-2.0"}
authors = [{name = "Meir Miyara", email = "meir.miyara@gmail.com"}]
keywords = ["unfoldedcircle", "integration", "cambridge-audio", "streammagic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3.11",
    "Topic :: Home Automation",
]
dependencies = [
    "ucapi-framework>=1.9.8",
    "ucapi>=0.7.0",
    "aiostreammagic>=2.13.2",
    "aiohttp>=3.9.0",
]
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/mase1981/uc-intg-cambridge-audio"
"Bug Reports" = "https://github.com/mase1981/uc-intg-cambridge-audio/issues"

[tool.setuptools]
packages = ["uc_intg_cambridge_audio"]

[tool.setuptools.dynamic]
version = {attr = "uc_intg_cambridge_audio.__version__"}

[project.scripts]
uc-intg-cambridge-audio = "uc_intg_cambridge_audio:main"
